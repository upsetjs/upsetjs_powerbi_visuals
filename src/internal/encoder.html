<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>License Signer Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        display: flex;
      }
      section {
        padding: 1em;
      }
      form {
        display: block;
        width: 30em;
        display: flex;
        flex-direction: column;
      }
      .r {
        display: flex;
        flex-direction: column;
      }
      label {
        font-weight: bold;
        display: block;
      }
      .buttons {
        margin: 1em;
        text-align: center;
      }
      button {
        padding: 0.5em;
        min-width: 10em;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Alternative Key Generator</h1>
      <form id="key2">
        <div class="r">
          <label for="key2">Key</label>
          <textarea id="key2" name="key" required rows="2"></textarea>
        </div>
        <div class="r">
          <label for="payload2">Payload</label>
          <input id="payload2" name="payload" required value="30.09.2020:MS" />
        </div>
        <div class="buttons">
          <button type="submit">Sign</button>
          <button type="reset">Reset</button>
        </div>
        <div class="r">
          <label for="o2">Signed</label>
          <textarea id="o2" readonly rows="2"></textarea>
        </div>
        <div class="r">
          <label for="o3">Verify</label>
          <textarea id="o3" readonly rows="2"></textarea>
        </div>
      </form>
    </section>
    <script type="module">
      // var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';

      // encoder
      // [https://gist.github.com/999166] by [https://github.com/nignag]
      function btoa(input, chars) {
        var str = String(input);
        for (
          // initialize result and counter
          var block, charCode, idx = 0, map = chars, output = '';
          // if the next str index does not exist:
          //   change the mapping table to "="
          //   check if d has no fractional digits
          str.charAt(idx | 0) || ((map = '='), idx % 1);
          // "8 - idx % 1 * 8" generates the sequence 2, 4, 6, 8
          output += map.charAt(63 & (block >> (8 - (idx % 1) * 8)))
        ) {
          charCode = str.charCodeAt((idx += 3 / 4));
          if (charCode > 0xff) {
            throw new InvalidCharacterError(
              "'btoa' failed: The string to be encoded contains characters outside of the Latin1 range."
            );
          }
          block = (block << 8) | charCode;
        }
        return output;
      }

      // decoder
      // [https://gist.github.com/1020396] by [https://github.com/atk]
      function atob(input, chars) {
        var str = String(input).replace(/[=]+$/, ''); // #31: ExtendScript bad parse of /=
        if (str.length % 4 === 1) {
          throw new InvalidCharacterError("'atob' failed: The string to be decoded is not correctly encoded.");
        }
        for (
          // initialize result and counters
          var bc = 0, bs, buffer, idx = 0, output = '';
          // get next character
          (buffer = str.charAt(idx++)); // eslint-disable-line no-cond-assign
          // character found in table? initialize bit storage and add its ascii value;
          ~buffer &&
          ((bs = bc % 4 ? bs * 64 + buffer : buffer),
          // and if not first of each 4 characters,
          // convert the first 8 bits to one ascii character
          bc++ % 4)
            ? (output += String.fromCharCode(255 & (bs >> ((-2 * bc) & 6))))
            : 0
        ) {
          // try to find character in table (0-63, not found => -1)
          buffer = chars.indexOf(buffer);
        }
        return output;
      }
      function utf8_decode(e) {
        let t = '';
        let n = 0;
        while (n < e.length) {
          const r = e.charCodeAt(n);
          if (r < 128) {
            t += String.fromCharCode(r);
            n++;
          } else if (r > 191 && r < 224) {
            const c2 = e.charCodeAt(n + 1);
            t += String.fromCharCode(((r & 31) << 6) | (c2 & 63));
            n += 2;
          } else {
            const c2 = e.charCodeAt(n + 1);
            const c3 = e.charCodeAt(n + 2);
            t += String.fromCharCode(((r & 15) << 12) | ((c2 & 63) << 6) | (c3 & 63));
            n += 3;
          }
        }
        return t;
      }

      function utf8_encode(t) {
        let e = '';
        let n = 0;
        // 6 bit encoding
        while (n < t.length) {
          const r = t.charCodeAt(n++);
          if (r < 128) {
            e += String.fromCharCode(r);
          } else if (r > 191 && r < 224) {
            e += String.fromCharCode((r >> 6) & 31);
            e += String.fromCharCode(r & 61);
          } else {
            e += String.fromCharCode((r >> 12) & 15);
            e += String.fromCharCode((r >> 6) & 63);
            e += String.fromCharCode(r & 63);
          }
        }
        // console.log(Array.from(e).map((e) => e.charCodeAt(0)));
        return e;
      }

      document.getElementById('key2').onsubmit = (e) => {
        e.preventDefault();
        const data = new FormData(e.currentTarget);
        const key = data.get('key');
        const payload = data.get('payload');

        const r = btoa(utf8_encode(payload), key);
        document.getElementById('o2').value = r;
        const decoded = utf8_decode(atob(r, key));
        document.getElementById('o3').value = decoded;
      };
    </script>
  </body>
</html>
